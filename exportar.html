<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIMECO — Exportar</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/print.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#1a3a5c">
</head>
<body data-moneda-fija="1">
  <header class="app-header no-print">
    <div class="header-brand u-pointer" onclick="window.location.href='obras.html'">
      <img src="assets/logo_claro.png" alt="VIMECO S.A." class="header-logo">
      <span class="header-title" id="header-obra-nombre">Exportar</span>
    </div>
    <nav class="header-tabs" id="header-tabs"></nav>
    <div class="flex items-center gap-3">
      <span class="header-dolar" id="header-dolar">USD = —</span>
      <button class="btn btn-sm btn-outline btn-icon" id="header-modo" aria-label="Modo de la obra" title="Modo de la obra"></button>
      <button class="btn btn-sm btn-outline btn-icon" onclick="window.location.href='obras.html'" aria-label="Volver" title="Volver"><svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    </div>
  </header>
  <nav class="subtabs-bar no-print" id="header-subtabs"></nav>

  <main class="app-main" id="main-content" style="display:none;">
    <div class="card no-print">
      <div class="card-header"><span class="card-title">Documento</span></div>
      <div class="card-body">
        <div class="form-group">
          <label>Secciones a incluir</label>
          <div class="exportar-secciones" id="exportar-secciones"></div>
        </div>

        <div class="form-group">
          <label for="export-notas">Notas al pie</label>
          <textarea class="form-control" id="export-notas" rows="3" placeholder="Aclaraciones que van al pie del resumen." data-solo-edicion></textarea>
          <p class="form-hint">Se guardan en la obra y salen al pie del Resumen.</p>
        </div>

        <div class="form-group">
          <span class="u-pointer ap-toggle-title" id="logo-toggle">
            <span class="ap-chevron" id="logo-chevron">&#9656;</span> Logo del membrete
          </span>
          <div class="export-logo-row hidden" id="logo-body">
            <img id="export-logo-preview" class="export-logo-preview" alt="Logo actual del membrete">
            <button type="button" class="btn btn-sm btn-outline btn-icon" id="export-logo-elegir" title="Cambiar logo" aria-label="Cambiar logo" data-solo-edicion><svg class="icon" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg></button>
            <input type="file" id="export-logo-input" accept="image/png,image/jpeg" hidden>
            <button type="button" class="btn btn-outline btn-sm hidden" id="export-logo-reset" data-solo-edicion>Restaurar predeterminado</button>
            <p class="form-hint">Se guarda en la obra y reemplaza el logo VIMECO en el PDF y el Excel. PNG o JPG.</p>
          </div>
        </div>

        <div class="exportar-acciones">
          <button class="btn btn-primary" id="btn-imprimir">Imprimir / Guardar PDF</button>
          <button class="btn btn-outline" id="btn-excel">Descargar Excel</button>
          <span class="form-hint" id="export-aviso"></span>
        </div>
      </div>
    </div>

    <p class="form-hint no-print" style="margin:0 0 .5rem;">Vista previa — hoja A4</p>
    <div class="doc-scroll">
      <div class="doc-hoja" id="doc"></div>
    </div>
  </main>
  <div id="main-loading" class="app-main"><div class="list-loading">Cargando datos de la obra…</div></div>

  <div class="modal-overlay hidden" id="modal-confirm">
    <div class="modal modal--sm">
      <div class="modal-header">
        <span class="modal-title" id="modal-confirm-title">Confirmar</span>
      </div>
      <div class="modal-body" style="text-align:center;padding:1.5rem 1.25rem;">
        <p id="modal-confirm-msg" style="color:var(--gray-600);"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-confirm-no">Cancelar</button>
        <button class="btn btn-primary" id="modal-confirm-yes">Confirmar</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/refs.js"></script>
  <script src="js/dolar.js"></script>
  <script src="js/moneda.js"></script>
  <script src="js/calcCostos.js"></script>
  <script src="js/insumosDatos.js"></script>
  <script src="js/logoBase64.js"></script>
  <script src="js/vendor/firebase-app-compat.js"></script>
  <script src="js/vendor/firebase-auth-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/encabezado.js"></script>
  <script src="js/numeracion.js"></script>
  <script src="js/presupuestoDatos.js"></script>
  <script src="js/planAvanceDatos.js"></script>
  <script src="js/excelExport.js"></script>
  <script src="js/exportar.js"></script>
</body>
</html>
