<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIMECO — Datos</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a3a5c">
  <style>
    .datos-extra-header, .datos-extra-linea { display: grid; grid-template-columns: 1fr 1fr 40px; gap: .5rem; align-items: center; }
    .datos-extra-header { font-size: .75rem; color: var(--gray-500); padding-bottom: .35rem; border-bottom: 1px solid var(--gray-200); }
    .datos-extra-linea { padding: .4rem 0; border-bottom: 1px solid var(--gray-200); }
    .datos-extra-linea:last-child { border-bottom: none; }
    .datos-extra-del { background: none; border: none; color: var(--danger); cursor: pointer; padding: .3rem; }
    .dolar-vivo-hint { display: flex; align-items: center; gap: .6rem; font-size: .85rem; color: var(--gray-600); margin-top: .35rem; }
    .dolar-vivo-hint button { background: none; border: none; color: var(--primary); cursor: pointer; padding: 0; font-size: .85rem; text-decoration: underline; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-brand u-pointer" onclick="window.location.href='obras.html'">
      <img src="assets/logo_claro.png" alt="VIMECO S.A." style="height:35px; width:auto;">
      <span class="header-title" id="header-obra-nombre">Datos</span>
    </div>
    <nav class="header-tabs" id="header-tabs"></nav>
    <div class="flex items-center gap-3">
      <span class="header-dolar" id="header-dolar">USD = —</span>
      <button class="btn btn-sm btn-outline" onclick="window.location.href='obras.html'">Volver</button>
    </div>
  </header>

  <main class="app-main" id="main-content" style="display:none;">
    <div class="card">
      <div class="card-header"><span class="card-title">Datos generales</span></div>
      <div class="card-body">
        <div class="form-row">
          <div class="form-group">
            <label for="obra-comitente">Comitente</label>
            <input type="text" id="obra-comitente" class="form-control" placeholder="Ej: Fuerza Aérea Argentina">
          </div>
          <div class="form-group u-mb-0">
            <label for="obra-dolar">Dólar de esta obra ($)</label>
            <input type="text" id="obra-dolar" class="form-control" placeholder="Ej: 1.520,00">
          </div>
        </div>
        <div class="dolar-vivo-hint">
          <span id="dolar-vivo-txt">Dólar oficial en vivo: —</span>
          <button type="button" id="btn-usar-dolar-vivo">Usar este valor</button>
        </div>
        <span class="form-hint">Se usa en todos los cálculos de esta obra (materiales, equipos). No se actualiza solo — cargalo a mano cuando quieras cambiarlo.</span>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Datos adicionales</span>
        <button class="btn btn-sm btn-primary" id="btn-add-dato">+ Agregar dato</button>
      </div>
      <div class="card-body">
        <div class="datos-extra-header">
          <span>Dato</span><span>Valor</span><span></span>
        </div>
        <div id="datos-extra-lista"></div>
      </div>
    </div>
  </main>
  <div id="main-loading" class="app-main"><div class="list-loading">Cargando datos…</div></div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/dolar.js"></script>
  <script src="js/moneda.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/datos-obra.js"></script>
</body>
</html>
