name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        run: node build.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # El bump se guarda en el repo por comodidad (el hook de commit lo lee),
      # pero no es lo que se publica: eso sale del working tree, que ya quedó
      # bumpeado por el Build. Por eso este paso NO puede tumbar el deploy —
      # pasó con la v105: el push se rechazó y el sitio se quedó en la v104.
      #
      # El `continue-on-error` de este paso hace que salga en verde en la
      # lista de runs aunque git pull/push adentro fallen — así se vio "success"
      # en 30+ runs seguidos mientras el push venía siendo rechazado en
      # silencio (2026-09 al 2026-09-08: app.html se quedó clavado en v105,
      # cada deploy volvía a bumpear v105→v106 sin avanzar nunca, aunque la
      # lista de Actions no mostraba ni un solo error). Por eso ahora, si el
      # pull/push falla, se emite un `::warning::` explícito — sí se ve en el
      # resumen del run sin tener que entrar a este paso puntual.
      #
      # Causa real encontrada el 2026-09-08 (vía la API de Actions, endpoint
      # de annotations, sin necesitar gh cli ni token de admin): el checkout
      # de arriba no tenía `fetch-depth`, así que clonaba shallow (depth 1).
      # Un `git pull --rebase` sobre un clone shallow falla siempre que el
      # remoto se movió — y acá siempre se movió, porque el propio Build ya
      # dejó app.html modificado en el working tree antes de este paso. Se
      # repitió en 4 runs seguidos (v141→v144) con el mismo warning exacto.
      # Fix: `fetch-depth: 0` en el checkout. Si el warning vuelve a aparecer
      # con el checkout ya en fetch-depth: 0, ahí sí revisar Settings →
      # Actions → General → "Workflow permissions" (Read and write) y la
      # protección de la rama main (tiene que permitir el push directo de
      # github-actions[bot]).
      - name: Commit version bump
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "ci: bump version [skip ci]"
          # main puede haber avanzado mientras corría el build, o este puede ser
          # el re-run de un run cuyo bump ya se pusheó.
          if ! git pull --rebase origin main; then
            echo "::warning::Bump de versión: falló git pull --rebase, no se pudo actualizar app.html en el repo (el deploy salió igual, ya bumpeado en el artifact)."
            exit 0
          fi
          if ! git push; then
            echo "::warning::Bump de versión: el push fue rechazado, app.html quedó desactualizado en el repo (el deploy salió igual, ya bumpeado en el artifact). Revisar Workflow permissions y protección de main."
            exit 0
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
