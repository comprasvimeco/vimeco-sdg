name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        run: node build.js
      # El bump se guarda en el repo por comodidad (el hook de commit lo lee),
      # pero no es lo que se publica: eso sale del working tree, que ya quedó
      # bumpeado por el Build. Por eso este paso NO puede tumbar el deploy —
      # pasó con la v105: el push se rechazó y el sitio se quedó en la v104.
      #
      # El `continue-on-error` de este paso hace que salga en verde en la
      # lista de runs aunque git pull/push adentro fallen — así se vio "success"
      # en 30+ runs seguidos mientras el push venía siendo rechazado en
      # silencio. Por eso, si el pull/push falla, se emite un `::warning::`
      # explícito — sí se ve en el resumen del run sin entrar a este paso.
      #
      # Causa real, encontrada dos veces (leyendo el log del paso, no sólo el
      # `::warning::` genérico): el Build dejaba un archivo modificado sin
      # comitear y `git pull --rebase` se negaba con "cannot pull with rebase:
      # You have unstaged changes" — nada que ver con el checkout ni con
      # permisos. En 2026-09-08 fue `js/config.js` (inyección de
      # GEMINI_API_KEY), y se resolvió corriendo esa inyección como paso
      # aparte, DESPUÉS de este commit. En 2026-09-18 fue `js/version.js`, que
      # el Build empezó a escribir mientras este `git add` seguía nombrando
      # sólo app.html y sw.js: el número del sitio avanzaba y el del repo no,
      # así que el hook de commit venía repitiendo el mismo vNNN.
      #
      # Por eso ahora se comitea TODO lo que el Build modificó, en vez de una
      # lista fija que hay que acordarse de actualizar. La key de Gemini no
      # corre riesgo: se inyecta en el paso siguiente, después de este commit.
      #
      # Si el warning reaparece habiendo confirmado que el working tree queda
      # limpio acá, recién ahí revisar Settings → Actions → General →
      # "Workflow permissions" (Read and write) y la protección de la rama main
      # (tiene que permitir el push directo de github-actions[bot]).
      - name: Commit version bump
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          # Red de seguridad: que se vea acá, y no dentro de meses con el
          # número de versión repitiéndose, si el Build empieza a tocar algo más.
          tocados=$(git diff --cached --name-only | sort | paste -sd" " -)
          if [ "$tocados" != "app.html js/version.js sw.js" ]; then
            echo "::warning::El bump de versión está comiteando archivos que no son los que deja el Build: $tocados"
          fi
          git commit -m "ci: bump version [skip ci]"
          # main puede haber avanzado mientras corría el build, o este puede ser
          # el re-run de un run cuyo bump ya se pusheó.
          if ! git pull --rebase origin main; then
            echo "::warning::Bump de versión: falló git pull --rebase, no se pudo actualizar app.html en el repo (el deploy salió igual, ya bumpeado en el artifact)."
            exit 0
          fi
          if ! git push; then
            echo "::warning::Bump de versión: el push fue rechazado, app.html quedó desactualizado en el repo (el deploy salió igual, ya bumpeado en el artifact). Revisar Workflow permissions y protección de main."
            exit 0
          fi
      # Recién acá, con el commit del bump ya hecho, se pisa config.js con la
      # key real — nunca se comitea (placeholder en el repo a propósito).
      - name: Inject Gemini API key
        run: node build.js --inject-key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
