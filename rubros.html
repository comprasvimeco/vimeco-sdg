<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIMECO — Rubros</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a3a5c">
</head>
<body>
  <header class="app-header">
    <div class="header-brand u-pointer" onclick="window.location.href='app.html'">
      <img src="assets/logo_claro.png" alt="VIMECO S.A." style="height:35px; width:auto;">
      <span class="header-title">Rubros</span>
    </div>
    <div class="flex items-center gap-3">
      <span class="header-dolar" id="header-dolar">USD = —</span>
      <button class="btn btn-sm btn-outline" onclick="window.location.href='app.html'">Volver</button>
    </div>
  </header>

  <main class="app-main">
    <div class="list-toolbar">
      <span class="list-toolbar-title">Rubros del catálogo</span>
      <button class="btn btn-primary btn-sm" id="btn-add-rubro">+ Agregar rubro</button>
    </div>
    <div class="form-group">
      <input type="text" id="rubros-search" class="form-control" placeholder="Buscar rubro...">
    </div>
    <div id="rubros-list" class="list-container">
      <div class="list-loading">Cargando rubros…</div>
    </div>
  </main>

  <!-- Modal: Agregar / Editar rubro -->
  <div class="modal-overlay hidden" id="modal-rubro">
    <div class="modal modal--sm">
      <div class="modal-header">
        <span class="modal-title" id="modal-rubro-title">Agregar rubro</span>
        <button class="modal-close" id="modal-rubro-close"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="form-group u-mb-0">
          <label for="rubro-nombre">Nombre *</label>
          <input type="text" id="rubro-nombre" class="form-control" placeholder="Ej: Movimiento de suelos">
        </div>

        <div id="modal-rubro-error" class="alert alert-error hidden"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-rubro-cancel">Cancelar</button>
        <button class="btn btn-primary" id="modal-rubro-save">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal: Confirmar acción -->
  <div class="modal-overlay hidden" id="modal-confirm">
    <div class="modal modal--sm">
      <div class="modal-header">
        <span class="modal-title" id="modal-confirm-title">Confirmar</span>
      </div>
      <div class="modal-body" style="text-align:center;padding:1.5rem 1.25rem;">
        <p id="modal-confirm-msg" style="color:var(--gray-600);"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-confirm-no">Cancelar</button>
        <button class="btn btn-primary" id="modal-confirm-yes">Confirmar</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dolar.js"></script>
  <script src="js/moneda.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/rubros.js"></script>
</body>
</html>
