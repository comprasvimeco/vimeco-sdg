<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIMECO — Cotizaciones</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a3a5c">
</head>
<body>
  <header class="app-header">
    <div class="header-brand u-pointer" onclick="window.location.href='app.html'">
      <img src="assets/logo_claro.png" alt="VIMECO S.A." style="height:35px; width:auto;">
      <span class="header-title">Cotizaciones</span>
    </div>
    <div class="flex items-center gap-3">
      <span class="header-dolar" id="header-dolar">USD = —</span>
      <button class="btn btn-sm btn-outline" onclick="window.location.href='app.html'">Volver</button>
    </div>
  </header>

  <main class="app-main">
    <div class="list-toolbar">
      <span class="list-toolbar-title">Fuentes de precios (Cotizaciones)</span>
      <button class="btn btn-primary btn-sm" id="btn-add-cotizacion">+ Agregar cotización</button>
    </div>
    <div id="cotizaciones-list" class="list-container">
      <div class="list-loading">Cargando cotizaciones…</div>
    </div>
  </main>

  <!-- Modal: Agregar / Editar cotización -->
  <div class="modal-overlay hidden" id="modal-cotizacion">
    <div class="modal modal--sm">
      <div class="modal-header">
        <span class="modal-title" id="modal-cotizacion-title">Agregar cotización</span>
        <button class="modal-close" id="modal-cotizacion-close"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="cotizacion-nombre">Nombre *</label>
          <input type="text" id="cotizacion-nombre" class="form-control" placeholder="Ej: CyP Taller Río Cuarto">
        </div>
        <div class="form-group">
          <label for="cotizacion-obra">Obra</label>
          <select id="cotizacion-obra" class="form-control">
            <option value="">— General (sin obra) —</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="cotizacion-proveedor">Proveedor</label>
            <input type="text" id="cotizacion-proveedor" class="form-control" placeholder="Opcional">
          </div>
          <div class="form-group u-mb-0">
            <label for="cotizacion-fecha">Fecha</label>
            <input type="date" id="cotizacion-fecha" class="form-control">
          </div>
        </div>

        <div id="modal-cotizacion-error" class="alert alert-error hidden"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-cotizacion-cancel">Cancelar</button>
        <button class="btn btn-primary" id="modal-cotizacion-save">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal: Confirmar acción -->
  <div class="modal-overlay hidden" id="modal-confirm">
    <div class="modal modal--sm">
      <div class="modal-header">
        <span class="modal-title" id="modal-confirm-title">Confirmar</span>
      </div>
      <div class="modal-body" style="text-align:center;padding:1.5rem 1.25rem;">
        <p id="modal-confirm-msg" style="color:var(--gray-600);"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-confirm-no">Cancelar</button>
        <button class="btn btn-primary" id="modal-confirm-yes">Confirmar</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dolar.js"></script>
  <script src="js/moneda.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/cotizaciones.js"></script>
</body>
</html>
