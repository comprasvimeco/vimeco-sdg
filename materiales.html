<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIMECO — Materiales</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#1a3a5c">
  <style>
    .linea-select-container { min-width: 0; }
    .mat-filtros { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; margin-bottom: .75rem; }
    .mat-filtros #materiales-search { flex: 1 1 220px; max-width: 320px; }
    .mat-filtros select { flex: 0 1 220px; width: auto; }
    .mat-filtros label { display: flex; align-items: center; gap: .35rem; font-size: .85rem; color: var(--gray-600); white-space: nowrap; }
    .mat-conteo { font-size: .8rem; color: var(--gray-500); margin-left: auto; }
    .mat-tabla-wrap { overflow: auto; max-height: 72vh; border: 1px solid var(--gray-200); border-radius: var(--radius); background: var(--white); }
    .mat-tabla { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .82rem; }
    .mat-tabla th, .mat-tabla td { padding: .35rem .5rem; border-bottom: 1px solid var(--gray-200); white-space: nowrap; background: var(--white); text-align: left; }
    .mat-tabla thead th { position: sticky; top: 0; z-index: 2; background: var(--gray-100); font-size: .72rem; font-weight: 600; color: var(--gray-600); border-bottom: 2px solid var(--gray-300); cursor: pointer; user-select: none; }
    .mat-tabla thead th.mat-sin-orden { cursor: default; }
    .mat-tabla .num { text-align: right; font-variant-numeric: tabular-nums; }
    .mat-tabla .mat-nombre { white-space: normal; min-width: 220px; font-weight: 500; color: var(--gray-800); }
    .mat-tabla .mat-vacio { color: var(--gray-400); font-style: italic; }
    .mat-tabla .mat-vigente { font-size: .68rem; color: var(--primary); margin-left: .3rem; }
    .mat-tabla tbody tr:hover td { background: var(--gray-50); }
    .mat-tabla .mat-acciones { text-align: right; }
    .mat-tabla .mat-alt { font-size: .68rem; color: var(--gray-400); margin-left: .3rem; }
    .mat-tabla tr.mat-fila-alt td { color: var(--gray-500); }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-brand u-pointer" onclick="window.location.href='app.html'">
      <img src="assets/logo_claro.png" alt="VIMECO S.A." class="header-logo">
      <span class="header-title">Materiales</span>
    </div>
    <div class="flex items-center gap-3">
      <span class="header-dolar" id="header-dolar">USD = —</span>
      <button class="btn btn-sm btn-outline btn-icon" onclick="window.location.href='app.html'" aria-label="Volver" title="Volver"><svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    </div>
  </header>

  <main class="app-main">
    <div class="list-toolbar">
      <span class="list-toolbar-title">Catálogo de materiales</span>
      <button class="btn btn-primary btn-sm" id="btn-add-material">+ Agregar material</button>
    </div>
    <div class="mat-filtros">
      <input type="text" id="materiales-search" class="form-control" placeholder="Buscar material o proveedor...">
      <select id="materiales-filtro-obra" class="form-control"><option value="">Todas las obras</option></select>
      <select id="materiales-filtro-proveedor" class="form-control"><option value="">Todos los proveedores</option></select>
      <label><input type="checkbox" id="materiales-solo-vigente"> Sólo precio vigente</label>
      <span class="mat-conteo" id="materiales-conteo"></span>
    </div>
    <div id="materiales-list" class="mat-tabla-wrap">
      <div class="list-loading">Cargando materiales…</div>
    </div>
  </main>

  <!-- Modal: Agregar / Editar material -->
  <div class="modal-overlay hidden" id="modal-material">
    <div class="modal modal--lg">
      <div class="modal-header">
        <span class="modal-title" id="modal-material-title">Agregar material</span>
        <button class="modal-close" id="modal-material-close"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="material-nombre">Nombre *</label>
          <input type="text" id="material-nombre" class="form-control" placeholder="Ej: Cemento Portland x50kg">
        </div>
        <div class="form-group">
          <label for="material-unidad">Unidad *</label>
          <input type="text" id="material-unidad" class="form-control" placeholder="Ej: kg, m3, u">
        </div>
        <div class="form-group">
          <label>Precio actual *</label>
          <div class="form-row">
            <input type="text" id="material-precio-usd" class="form-control" placeholder="USD, ej: 5 o =50*100">
            <input type="text" id="material-precio-ars" class="form-control" placeholder="$, ej: 5000">
          </div>
          <span class="form-hint" id="material-precio-nota"></span>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="material-proveedor">Proveedor</label>
            <input type="text" id="material-proveedor" class="form-control" placeholder="Opcional">
          </div>
          <div class="form-group u-mb-0">
            <label for="material-fecha">Fecha del precio</label>
            <input type="date" id="material-fecha" class="form-control">
          </div>
        </div>
        <div class="form-group u-mb-0">
          <label>Fuente (obra)</label>
          <div class="linea-select-container" id="material-fuente-container"></div>
          <span class="form-hint">Obras que ya tienen un precio cargado para este material — elegí una para verlo/editarlo, o cualquier otra para cargar el primero.</span>
        </div>
        <div id="material-comparativa" class="mep-comparativa"></div>

        <div id="modal-material-error" class="alert alert-error hidden"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-material-cancel">Cancelar</button>
        <button class="btn btn-primary" id="modal-material-save">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal: Confirmar acción -->
  <div class="modal-overlay hidden" id="modal-confirm">
    <div class="modal modal--sm">
      <div class="modal-header">
        <span class="modal-title" id="modal-confirm-title">Confirmar</span>
      </div>
      <div class="modal-body" style="text-align:center;padding:1.5rem 1.25rem;">
        <p id="modal-confirm-msg" style="color:var(--gray-600);"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-confirm-no">Cancelar</button>
        <button class="btn btn-primary" id="modal-confirm-yes">Confirmar</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/searchable-select.js"></script>
  <script src="js/dolar.js"></script>
  <script src="js/moneda.js"></script>
  <script src="js/calcCostos.js"></script>
  <script src="js/preciosMaterial.js"></script>
  <script src="js/vendor/firebase-app-compat.js"></script>
  <script src="js/vendor/firebase-auth-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/undo.js"></script>
  <script src="js/materiales.js"></script>
</body>
</html>
