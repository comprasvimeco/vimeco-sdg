<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIMECO — Equipos</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a3a5c">
</head>
<body>
  <header class="app-header">
    <div class="header-brand u-pointer" onclick="window.location.href='app.html'">
      <img src="assets/logo_claro.png" alt="VIMECO S.A." style="height:35px; width:auto;">
      <span class="header-title">Equipos</span>
    </div>
    <div class="flex items-center gap-3">
      <span class="header-dolar" id="header-dolar">USD = —</span>
      <button class="btn btn-sm btn-outline" onclick="window.location.href='app.html'">Volver</button>
    </div>
  </header>

  <main class="app-main">
    <div class="list-toolbar">
      <span class="list-toolbar-title">Costo de equipos</span>
      <div class="flex gap-2">
        <button class="btn btn-secondary btn-sm hidden" id="btn-seed">Importar lista de vimeco-oc</button>
        <button class="btn btn-primary btn-sm" id="btn-add-equipo">+ Agregar equipo</button>
      </div>
    </div>
    <div class="form-group">
      <input type="text" id="equipos-search" class="form-control" placeholder="Buscar por código o tipo...">
    </div>
    <div id="equipos-list" class="list-container">
      <div class="list-loading">Cargando equipos…</div>
    </div>
  </main>

  <!-- Modal: Agregar / Editar equipo -->
  <div class="modal-overlay hidden" id="modal-equipo">
    <div class="modal modal--sm">
      <div class="modal-header">
        <span class="modal-title" id="modal-equipo-title">Agregar equipo</span>
        <button class="modal-close" id="modal-equipo-close"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <div class="form-group">
            <label for="equipo-codigo">Código *</label>
            <input type="text" id="equipo-codigo" class="form-control" placeholder="Ej: C 172">
          </div>
          <div class="form-group">
            <label for="equipo-tipo">Tipo / Descripción</label>
            <input type="text" id="equipo-tipo" class="form-control" placeholder="Ej: Camion L111">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="equipo-potencia">Potencia (HP)</label>
            <input type="text" id="equipo-potencia" class="form-control" placeholder="Ej: 220">
          </div>
          <div class="form-group">
            <label for="equipo-uso-anual">Uso anual (hs)</label>
            <input type="text" id="equipo-uso-anual" class="form-control" placeholder="Ej: 2000">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="equipo-vida-util">Vida útil (hs)</label>
            <input type="text" id="equipo-vida-util" class="form-control" placeholder="Ej: 10000">
          </div>
          <div class="form-group u-mb-0">
            <label for="equipo-costo">Costo actual (USD)</label>
            <input type="text" id="equipo-costo" class="form-control" placeholder="Ej: 60000">
          </div>
        </div>

        <div id="modal-equipo-error" class="alert alert-error hidden"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-equipo-cancel">Cancelar</button>
        <button class="btn btn-primary" id="modal-equipo-save">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal: Confirmar acción -->
  <div class="modal-overlay hidden" id="modal-confirm">
    <div class="modal modal--sm">
      <div class="modal-header">
        <span class="modal-title" id="modal-confirm-title">Confirmar</span>
      </div>
      <div class="modal-body" style="text-align:center;padding:1.5rem 1.25rem;">
        <p id="modal-confirm-msg" style="color:var(--gray-600);"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-confirm-no">Cancelar</button>
        <button class="btn btn-primary" id="modal-confirm-yes">Confirmar</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/dolar.js"></script>
  <script src="js/moneda.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/equipos.js"></script>
</body>
</html>
