<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIMECO — Biblioteca</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a3a5c">
  <style>
    .linea-select-container { min-width: 0; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-brand u-pointer" onclick="window.location.href='app.html'">
      <img src="assets/logo_claro.png" alt="VIMECO S.A." class="header-logo">
      <span class="header-title">Biblioteca</span>
    </div>
    <div class="flex items-center gap-3">
      <span class="header-dolar" id="header-dolar">USD = —</span>
      <button class="btn btn-sm btn-outline" onclick="window.location.href='app.html'">Volver</button>
    </div>
  </header>

  <main class="app-main">
    <div class="list-toolbar">
      <span class="list-toolbar-title">Catálogo de ítems</span>
      <div class="flex gap-2">
        <button class="btn btn-sm btn-outline" id="btn-rubros" title="Administrar rubros"><svg class="icon" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg> Rubros</button>
        <button class="btn btn-primary btn-sm" id="btn-add-item">+ Agregar ítem</button>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <input type="text" id="items-search" class="form-control" placeholder="Buscar ítem...">
      </div>
      <div class="form-group u-mb-0">
        <select id="items-filtro-rubro" class="form-control">
          <option value="">Todos los rubros</option>
        </select>
      </div>
    </div>
    <div id="items-list" class="list-container">
      <div class="list-loading">Cargando ítems…</div>
    </div>
  </main>

  <!-- Modal: Agregar / Editar datos del ítem -->
  <div class="modal-overlay hidden" id="modal-item">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-item-title">Agregar ítem</span>
        <button class="modal-close" id="modal-item-close"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="item-nombre">Nombre *</label>
          <input type="text" id="item-nombre" class="form-control" placeholder="Ej: Contrapiso H°A° e=10cm">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="item-unidad">Unidad *</label>
            <input type="text" id="item-unidad" class="form-control" placeholder="Ej: m2, m3, gl">
          </div>
          <div class="form-group u-mb-0">
            <label for="item-rubro">Rubro</label>
            <select id="item-rubro" class="form-control">
              <option value="">— Sin rubro —</option>
            </select>
          </div>
        </div>
        <div class="form-group u-mb-0" id="item-obra-grupo" style="max-width:260px;">
          <label for="item-obra">Primera obra *</label>
          <select id="item-obra" class="form-control">
            <option value="">— Elegir obra —</option>
          </select>
          <span class="form-hint">El ítem arranca con su receta vacía en esa obra — la carga desde su pantalla de Rendimientos.</span>
        </div>

        <div id="modal-item-error" class="alert alert-error hidden"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-item-cancel">Cancelar</button>
        <button class="btn btn-primary" id="modal-item-save">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal: Administrar rubros -->
  <div class="modal-overlay hidden" id="modal-rubros">
    <div class="modal modal--sm">
      <div class="modal-header">
        <span class="modal-title">Rubros</span>
        <button class="modal-close" id="modal-rubros-close"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="form-row" style="align-items:flex-start;">
          <div class="form-group u-mb-0" style="flex:1;">
            <input type="text" id="rubro-nombre" class="form-control" placeholder="Nombre del rubro">
          </div>
          <button class="btn btn-primary btn-sm" id="btn-guardar-rubro" style="white-space:nowrap;">Guardar</button>
        </div>
        <div id="modal-rubro-error" class="alert alert-error hidden" style="margin-top:.5rem;"></div>
        <div id="rubros-modal-list" class="list-container" style="margin-top:1rem;"></div>
      </div>
    </div>
  </div>

  <!-- Modal: Confirmar acción -->
  <div class="modal-overlay hidden" id="modal-confirm">
    <div class="modal modal--sm">
      <div class="modal-header">
        <span class="modal-title" id="modal-confirm-title">Confirmar</span>
      </div>
      <div class="modal-body" style="text-align:center;padding:1.5rem 1.25rem;">
        <p id="modal-confirm-msg" style="color:var(--gray-600);"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-confirm-no">Cancelar</button>
        <button class="btn btn-primary" id="modal-confirm-yes">Confirmar</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/searchable-select.js"></script>
  <script src="js/dolar.js"></script>
  <script src="js/moneda.js"></script>
  <script src="js/calcCostos.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/biblioteca.js"></script>
</body>
</html>
