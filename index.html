<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIMECO — Sistema de Gestión</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#1a3a5c">
</head>
<body class="login-page">
  <div>
    <img src="assets/logo_claro.png" alt="VIMECO S.A." style="width:180px; margin-bottom:1rem;">
    <h1>VIMECO — Sistema de Gestión</h1>
    <p>Presupuestos y seguimiento de costos de obra.</p>
    <a class="btn btn-primary" href="app.html">Entrar</a>
  </div>

  <script src="js/config.js"></script>
  <script src="js/firebase.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('/vimeco-sdg/sw.js', { updateViaCache: 'none' }).catch(() => {});
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (hadController) window.location.reload();
      });
    }
  </script>
</body>
</html>
