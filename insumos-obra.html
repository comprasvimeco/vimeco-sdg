<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIMECO — Insumos</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#1a3a5c">
  <style>
    .materiales-linea { display: grid; grid-template-columns: 1.3fr 90px 150px 1.6fr 150px; gap: .6rem; align-items: center; padding: .4rem 0; border-bottom: 1px solid var(--gray-200); }
    .materiales-linea:last-child { border-bottom: none; }
    .materiales-linea-header { font-size: .75rem; color: var(--gray-500); padding-bottom: .35rem; border-bottom: none !important; }
    .materiales-linea-header span:nth-child(3), .materiales-linea-header span:nth-child(5) { text-align: right; }
    .materiales-cantidad, .materiales-costo { text-align: right; white-space: nowrap; font-weight: 600; color: var(--gray-700); }
    .materiales-usados { color: var(--gray-500); font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; }
    .ap-resumen-row { display: flex; justify-content: space-between; padding: .3rem 0; font-size: .9rem; color: var(--gray-600); }
    .ap-resumen-row.total { font-size: 1.05rem; font-weight: 700; color: var(--primary); border-top: 1px solid var(--gray-200); padding-top: .6rem; margin-top: .4rem; }

    /* ===== MOBILE: misma grilla de ancho fijo que Cómputo -- se reacomoda en
       varias filas por línea, misma info, sin tocar el HTML/JS. ===== */
    @media (max-width: 700px) {
      .materiales-linea-header { display: none; }
      .materiales-linea {
        grid-template-columns: 1fr 1fr;
        grid-template-areas: "nombre nombre" "unidad cantidad" "usados usados" "costo costo";
        row-gap: .3rem; column-gap: .5rem; padding: .6rem 0;
      }
      .materiales-linea > *:nth-child(1) { grid-area: nombre; }
      .materiales-linea > *:nth-child(2) { grid-area: unidad; color: var(--gray-500); font-size: .85rem; }
      .materiales-linea > *:nth-child(2)::before { content: "Unidad: "; }
      .materiales-linea > *:nth-child(3) { grid-area: cantidad; text-align: left; }
      .materiales-linea > *:nth-child(3)::before { content: "Cantidad: "; font-weight: 400; color: var(--gray-500); }
      .materiales-linea > *:nth-child(4) {
        grid-area: usados; white-space: normal; overflow: visible; text-overflow: clip; font-size: .8rem;
      }
      .materiales-linea > *:nth-child(4)::before { content: "Usado en: "; color: var(--gray-400); }
      .materiales-linea > *:nth-child(5) { grid-area: costo; text-align: left; }
      .materiales-linea > *:nth-child(5)::before { content: "Costo estimado: "; font-weight: 400; color: var(--gray-500); }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-brand u-pointer" onclick="window.location.href='obras.html'">
      <img src="assets/logo_claro.png" alt="VIMECO S.A." class="header-logo">
      <span class="header-title" id="header-obra-nombre">Insumos</span>
    </div>
    <nav class="header-tabs" id="header-tabs"></nav>
    <div class="flex items-center gap-3">
      <span class="header-dolar" id="header-dolar">USD = —</span>
      <button class="btn btn-sm btn-outline btn-icon" onclick="window.location.href='obras.html'" aria-label="Volver" title="Volver"><svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    </div>
  </header>
  <nav class="subtabs-bar" id="header-subtabs"></nav>

  <main class="app-main" id="main-content" style="display:none;">
    <div class="card">
      <div class="card-header"><span class="card-title">Materiales necesarios</span></div>
      <div class="card-body" id="lineas-materiales"></div>
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">Resumen de materiales</span></div>
      <div class="card-body" id="resumen"></div>
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">Equipos necesarios</span></div>
      <div class="card-body" id="lineas-equipos"></div>
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">Resumen de equipos</span></div>
      <div class="card-body" id="resumen-equipos"></div>
    </div>
  </main>
  <div id="main-loading" class="app-main"><div class="list-loading">Cargando insumos…</div></div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/refs.js"></script>
  <script src="js/dolar.js"></script>
  <script src="js/moneda.js"></script>
  <script src="js/calcCostos.js"></script>
  <script src="js/calculadora-flotante.js"></script>
  <script src="js/vendor/firebase-app-compat.js"></script>
  <script src="js/vendor/firebase-auth-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/insumos-obra.js"></script>
</body>
</html>
