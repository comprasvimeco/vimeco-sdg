<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIMECO — Carga Fija</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a3a5c">
  <style>
    .cf-linea-header, .cf-linea { display: grid; grid-template-columns: 1.4fr 90px 130px 80px 130px 40px; gap: .5rem; align-items: center; }
    .cf-linea-header { font-size: .75rem; color: var(--gray-500); padding-bottom: .35rem; border-bottom: 1px solid var(--gray-200); }
    .cf-linea { padding: .4rem 0; border-bottom: 1px solid var(--gray-200); }
    .cf-linea:last-child { border-bottom: none; }
    .cf-linea-total { text-align: right; font-weight: 600; color: var(--gray-700); white-space: nowrap; }
    .cf-linea-del { background: none; border: none; color: var(--danger); cursor: pointer; padding: .3rem; }
    .cf-total-fijos { display: flex; justify-content: space-between; padding-top: .75rem; margin-top: .4rem; border-top: 1px solid var(--gray-200); font-weight: 700; color: var(--gray-700); }
    .ap-resumen-row { display: flex; justify-content: space-between; align-items: center; padding: .3rem 0; font-size: .9rem; color: var(--gray-600); gap: 1rem; }
    .ap-resumen-row input { max-width: 110px; text-align: right; }
    .ap-resumen-row.total { font-size: 1.05rem; font-weight: 700; color: var(--primary); border-top: 1px solid var(--gray-200); padding-top: .6rem; margin-top: .4rem; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-brand u-pointer" onclick="window.location.href='obras.html'">
      <img src="assets/logo_claro.png" alt="VIMECO S.A." class="header-logo">
      <span class="header-title" id="header-obra-nombre">Carga Fija</span>
    </div>
    <nav class="header-tabs" id="header-tabs"></nav>
    <div class="flex items-center gap-3">
      <span class="header-dolar" id="header-dolar">USD = —</span>
      <button class="btn btn-sm btn-outline btn-icon" onclick="window.location.href='obras.html'" aria-label="Volver" title="Volver"><svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    </div>
  </header>
  <nav class="subtabs-bar" id="header-subtabs"></nav>

  <main class="app-main" id="main-content" style="display:none;">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Gastos fijos de la obra</span>
        <button class="btn btn-sm btn-primary" id="btn-add-linea">+ Agregar concepto</button>
      </div>
      <div class="card-body">
        <div class="cf-linea-header">
          <span>Concepto</span><span>Cantidad</span><span>Precio unitario</span><span>Meses</span><span style="text-align:right;">Total</span><span></span>
        </div>
        <div id="lineas-carga-fija"></div>
        <div class="cf-total-fijos"><span>Total gastos fijos</span><span id="total-gastos-fijos">$ 0,00</span></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">Coeficiente K</span></div>
      <div class="card-body" id="coeficiente-k"></div>
    </div>
  </main>
  <div id="main-loading" class="app-main"><div class="list-loading">Cargando carga fija…</div></div>

  <!-- Modal: Confirmar acción -->
  <div class="modal-overlay hidden" id="modal-confirm">
    <div class="modal modal--sm">
      <div class="modal-header">
        <span class="modal-title" id="modal-confirm-title">Confirmar</span>
      </div>
      <div class="modal-body" style="text-align:center;padding:1.5rem 1.25rem;">
        <p id="modal-confirm-msg" style="color:var(--gray-600);"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-confirm-no">Cancelar</button>
        <button class="btn btn-primary" id="modal-confirm-yes">Confirmar</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/dolar.js"></script>
  <script src="js/moneda.js"></script>
  <script src="js/calcCostos.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/carga-fija.js"></script>
</body>
</html>
