<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIMECO — Cómputo</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a3a5c">
  <style>
    .computo-rubro-header { display: grid; grid-template-columns: 40px 1fr 160px 130px; gap: .6rem; align-items: center; padding: .4rem 0; margin-top: .6rem; border-bottom: 2px solid var(--gray-200); }
    .computo-rubro-header:first-child { margin-top: 0; }
    .computo-rubro-numero { font-weight: 700; color: var(--primary); font-size: .95rem; }
    .computo-rubro-nombre-input { font-weight: 700; font-size: .95rem; border: none; background: none; padding: .2rem 0; }
    .computo-rubro-nombre-input:focus { border-bottom: 1px solid var(--primary); outline: none; }
    .computo-rubro-acciones { display: flex; align-items: center; gap: .2rem; }
    .computo-rubro-add-linea, .computo-rubro-mover, .computo-rubro-del { background: none; border: none; color: var(--gray-400); cursor: pointer; padding: .25rem; }
    .computo-rubro-add-linea { color: var(--primary); margin-right: .3rem; padding-right: .5rem; border-right: 1px solid var(--gray-200); }
    .computo-rubro-add-linea:hover { color: var(--primary-dark, var(--primary)); }
    .computo-rubro-mover:hover:not(:disabled) { color: var(--primary); }
    .computo-rubro-del:not(:disabled):hover { color: var(--danger); }
    .computo-rubro-mover:disabled, .computo-rubro-del:disabled { opacity: .25; cursor: default; }
    .computo-rubro-add-linea .icon, .computo-rubro-mover .icon, .computo-rubro-del .icon, .computo-linea-mover .icon, .computo-linea-dup .icon, .computo-linea-ap .icon, .computo-linea-del .icon { width: 15px; height: 15px; }
    .computo-rubro-subtotal { font-weight: 600; color: var(--gray-700); white-space: nowrap; text-align: right; }
    .computo-rubro-lineas { min-height: 4px; }
    .computo-rubro-lineas.drop-target { background: var(--gray-100); outline: 2px dashed var(--primary); outline-offset: -2px; }
    .computo-linea { display: grid; grid-template-columns: 40px 1.3fr 70px 90px 120px 130px 170px; gap: .6rem; align-items: center; padding: .4rem 0; border-bottom: 1px solid var(--gray-200); }
    .computo-linea:last-child { border-bottom: none; }
    .computo-linea[draggable="true"] { cursor: grab; }
    .computo-linea.dragging { opacity: .4; }
    .computo-linea-numero { color: var(--gray-500); font-size: .85rem; }
    .computo-linea-costo, .computo-linea-total { text-align: right; white-space: nowrap; }
    .computo-linea-total { font-weight: 600; color: var(--gray-700); }
    .computo-linea-header { font-size: .75rem; color: var(--gray-500); padding-bottom: .35rem; border-bottom: none !important; }
    .computo-linea-header span:nth-child(3), .computo-linea-header span:nth-child(4) { text-align: center; }
    .computo-linea-header span:nth-child(5), .computo-linea-header span:nth-child(6) { text-align: right; }
    .computo-linea-acciones { display: flex; align-items: center; justify-content: flex-end; gap: .2rem; }
    .computo-linea-mover, .computo-linea-dup, .computo-linea-del { background: none; border: none; color: var(--gray-400); cursor: pointer; padding: .25rem; }
    .computo-linea-mover:hover:not(:disabled) { color: var(--primary); }
    .computo-linea-mover:disabled { opacity: .25; cursor: default; }
    .computo-linea-dup:hover { color: var(--primary); }
    .computo-linea-ap { display: inline-flex; color: var(--gray-400); padding: .25rem; }
    .computo-linea-ap:hover { color: var(--primary); }
    .computo-linea-del:hover { color: var(--danger); }
    .ap-resumen-row { display: flex; justify-content: space-between; padding: .3rem 0; font-size: .9rem; color: var(--gray-600); }
    .ap-resumen-row.total { font-size: 1.05rem; font-weight: 700; color: var(--primary); border-top: 1px solid var(--gray-200); padding-top: .6rem; margin-top: .4rem; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-brand u-pointer" onclick="window.location.href='obras.html'">
      <img src="assets/logo_claro.png" alt="VIMECO S.A." style="height:35px; width:auto;">
      <span class="header-title" id="header-obra-nombre">Cómputo</span>
    </div>
    <nav class="header-tabs" id="header-tabs"></nav>
    <div class="flex items-center gap-3">
      <span class="header-dolar" id="header-dolar">USD = —</span>
      <button class="btn btn-sm btn-outline" onclick="window.location.href='obras.html'">Volver</button>
    </div>
  </header>

  <main class="app-main" id="main-content" style="display:none;">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Ítems del cómputo</span>
        <div class="flex gap-2">
          <button class="btn btn-sm btn-outline" id="btn-add-rubro">+ Agregar rubro</button>
        </div>
      </div>
      <div class="card-body" id="lineas-computo"></div>
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">Resumen</span></div>
      <div class="card-body" id="resumen"></div>
    </div>
  </main>
  <div id="main-loading" class="app-main"><div class="list-loading">Cargando cómputo…</div></div>

  <!-- Modal: Confirmar acción -->
  <div class="modal-overlay hidden" id="modal-confirm">
    <div class="modal modal--sm">
      <div class="modal-header">
        <span class="modal-title" id="modal-confirm-title">Confirmar</span>
      </div>
      <div class="modal-body" style="text-align:center;padding:1.5rem 1.25rem;">
        <p id="modal-confirm-msg" style="color:var(--gray-600);"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-confirm-no">Cancelar</button>
        <button class="btn btn-primary" id="modal-confirm-yes">Confirmar</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/dolar.js"></script>
  <script src="js/moneda.js"></script>
  <script src="js/calcCostos.js"></script>
  <script src="js/calculadora-flotante.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/computo.js"></script>
</body>
</html>
